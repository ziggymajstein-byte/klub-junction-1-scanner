<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Klub Junction 1 - Scanner</title>

  <!-- QR CODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 24px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .backend-status {
      text-align: center;
      margin-bottom: 18px;
      font-weight: bold;
      color: #15803d;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mode-buttons button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkin-btn {
      background: #16a34a;
      color: white;
    }

    .checkout-btn {
      background: #2563eb;
      color: white;
    }

    .active {
      box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.18);
    }

    .scanner-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .instruction {
      text-align: center;
      margin-bottom: 15px;
      font-size: 15px;
      color: #555;
    }

    #reader {
      width: 100%;
    }

    #reader video {
      width: 100% !important;
      border-radius: 10px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }

    .result {
      display: none;
      margin-top: 20px;
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.12);
    }

    .success {
      border: 3px solid #16a34a;
    }

    .warning {
      border: 3px solid #f59e0b;
    }

    .error {
      border: 3px solid #dc2626;
    }

    .result-title {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .success-text {
      color: #15803d;
    }

    .warning-text {
      color: #b45309;
    }

    .error-text {
      color: #dc2626;
    }

    .attendee-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      text-align: right;
    }

    .scan-again {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .scanner-id {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #666;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 23px;
      }

      .container {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Klub Junction 1 Pool Fest</h1>
    <p>Access Management System</p>
  </div>

  <div class="container">

    <div class="backend-status">
      ● Backend is online
    </div>

    <!-- MODE BUTTONS -->

    <div class="mode-buttons">

      <button
        id="checkInButton"
        class="checkin-btn active"
        onclick="setMode('CHECK-IN')">
        CHECK-IN
      </button>

      <button
        id="checkOutButton"
        class="checkout-btn"
        onclick="setMode('CHECK-OUT')">
        CHECK-OUT
      </button>

    </div>


    <!-- SCANNER -->

    <div class="scanner-card">

      <div
        id="instruction"
        class="instruction">
        Scan the attendee QR code to check them in.
      </div>

      <div id="reader"></div>

      <div
        id="loading"
        class="loading">
        Processing QR code...
      </div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result">

      <div
        id="resultTitle"
        class="result-title">
      </div>

      <div
        id="attendeeDetails">
      </div>

      <button
        class="scan-again"
        onclick="scanAgain()">
        SCAN ANOTHER QR CODE
      </button>

    </div>


    <!-- SCANNER ID -->

    <div class="scanner-id">
      Scanner ID:
      <strong id="scannerId"></strong>
    </div>

  </div>


<script>

/* =========================================================
   APPS SCRIPT BACKEND
   ========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxZFnq-AEx4GLg22mQKxagnZzjLq9Z9rx8c1GZB1SNvlt7_RPAOVi5DM6S-iu3ztjZP/exec";


/* =========================================================
   VARIABLES
   ========================================================= */

let currentMode = "CHECK-IN";

let html5QrCode = null;

let scannerRunning = false;

let processingScan = false;


/* =========================================================
   SCANNER ID
   ========================================================= */

const scannerId =
"SCANNER-" +
Math.random()
.toString(36)
.substring(2, 8)
.toUpperCase();

document.getElementById("scannerId").textContent =
scannerId;


/* =========================================================
   SET MODE
   ========================================================= */

function setMode(mode) {

  currentMode = mode;

  const checkInButton =
    document.getElementById("checkInButton");

  const checkOutButton =
    document.getElementById("checkOutButton");

  const instruction =
    document.getElementById("instruction");


  if (mode === "CHECK-IN") {

    checkInButton.classList.add("active");

    checkOutButton.classList.remove("active");

    instruction.textContent =
      "Scan the attendee QR code to check them in.";

  } else {

    checkOutButton.classList.add("active");

    checkInButton.classList.remove("active");

    instruction.textContent =
      "Scan the attendee QR code to check them out.";

  }

}


/* =========================================================
   START CAMERA
   ========================================================= */

function startScanner() {

  if (scannerRunning) {
    return;
  }

  html5QrCode =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 250
    },

    aspectRatio: 1.0

  };


  html5QrCode
    .start(
      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        handleQRCode(decodedText);

      },

      function(errorMessage) {

        // Normal scanning errors are ignored.

      }

    )

    .then(function() {

      scannerRunning = true;

    })

    .catch(function(error) {

      console.error(
        "Camera error:",
        error
      );

      showError(
        "CAMERA ERROR",
        "Please allow camera access and reload the page."
      );

    });

}


/* =========================================================
   HANDLE QR CODE
   ========================================================= */

async function handleQRCode(qrValue) {

  /*
   * Prevent the camera from sending
   * the same QR multiple times.
   */

  if (processingScan) {
    return;
  }

  processingScan = true;


  stopScanner();


  document.getElementById("loading")
    .style.display = "block";

  document.getElementById("result")
    .style.display = "none";


  try {

    let action;


    if (currentMode === "CHECK-IN") {

      action = "checkIn";

    } else {

      action = "checkOut";

    }


    /*
     * Send QR code to Apps Script.
     */

    const response =
      await fetch(API_URL, {

        method: "POST",

        body: JSON.stringify({

          action: action,

          qrValue: qrValue,

          scannerId: scannerId

        })

      });


    const result =
      await response.json();


    document.getElementById("loading")
      .style.display = "none";


    /*
     * SUCCESS
     */

    if (result.success) {

      showSuccess(result);

    }

    /*
     * FAILURE
     */

    else {

      handleFailure(result);

    }


  } catch (error) {

    console.error(error);


    document.getElementById("loading")
      .style.display = "none";


    showError(
      "CONNECTION ERROR",
      "Unable to communicate with the access management system."
    );

  }

}


/* =========================================================
   SUCCESS
   ========================================================= */

function showSuccess(result) {

  const resultBox =
    document.getElementById("result");

  resultBox.className =
    "result success";

  resultBox.style.display =
    "block";


  document.getElementById("resultTitle")
    .innerHTML =
    '<span class="success-text">✓ ' +
    escapeHtml(
      result.message ||
      "SUCCESS"
    ) +
    '</span>';


  if (result.attendee) {

    document.getElementById(
      "attendeeDetails"
    ).innerHTML =
      createAttendeeDetails(
        result.attendee
      );

  }

}


/* =========================================================
   FAILURE
   ========================================================= */

function handleFailure(result) {

  const message =
    String(
      result.message || ""
    ).toUpperCase();


  /*
   * VERY IMPORTANT:
   *
   * Someone who is already inside
   * cannot check in again.
   */

  if (
    message.includes("ALREADY INSIDE")
  ) {

    showAlreadyInside(result);

    return;

  }


  showError(
    "ACCESS DENIED",
    result.message ||
    "QR code rejected."
  );

}


/* =========================================================
   ALREADY INSIDE
   ========================================================= */

function showAlreadyInside(result) {

  const resultBox =
    document.getElementById("result");

  resultBox.className =
    "result warning";

  resultBox.style.display =
    "block";


  document.getElementById("resultTitle")
    .innerHTML =
    '<span class="warning-text">⚠ ALREADY INSIDE</span>';


  if (result.attendee) {

    document.getElementById(
      "attendeeDetails"
    ).innerHTML =
      createAttendeeDetails(
        result.attendee
      );

  } else {

    document.getElementById(
      "attendeeDetails"
    ).innerHTML =
      "<p style='text-align:center'>" +
      escapeHtml(
        result.message
      ) +
      "</p>";

  }

}


/* =========================================================
   ERROR
   ========================================================= */

function showError(title, message) {

  const resultBox =
    document.getElementById("result");

  resultBox.className =
    "result error";

  resultBox.style.display =
    "block";


  document.getElementById("resultTitle")
    .innerHTML =
    '<span class="error-text">✕ ' +
    escapeHtml(title) +
    '</span>';


  document.getElementById(
    "attendeeDetails"
  ).innerHTML =

    "<p style='text-align:center'>" +
    escapeHtml(message) +
    "</p>";

}


/* =========================================================
   ATTENDEE DETAILS
   ========================================================= */

function createAttendeeDetails(attendee) {

  return `

    <div class="attendee-row">

      <span class="label">
        Name
      </span>

      <span class="value">
        ${escapeHtml(
          attendee.fullName || ""
        )}
      </span>

    </div>


    <div class="attendee-row">

      <span class="label">
        Category
      </span>

      <span class="value">
        ${escapeHtml(
          attendee.category || ""
        )}
      </span>

    </div>


    <div class="attendee-row">

      <span class="label">
        Pass ID
      </span>

      <span class="value">
        ${escapeHtml(
          attendee.passId || ""
        )}
      </span>

    </div>


    <div class="attendee-row">

      <span class="label">
        Status
      </span>

      <span class="value">
        ${escapeHtml(
          attendee.status || ""
        )}
      </span>

    </div>

  `;

}


/* =========================================================
   STOP CAMERA
   ========================================================= */

function stopScanner() {

  if (
    html5QrCode &&
    scannerRunning
  ) {

    html5QrCode
      .stop()
      .then(function() {

        scannerRunning = false;

        try {
          html5QrCode.clear();
        } catch (e) {}

      })
      .catch(function(error) {

        console.error(
          "Scanner stop error:",
          error
        );

        scannerRunning = false;

      });

  }

}


/* =========================================================
   SCAN AGAIN
   ========================================================= */

function scanAgain() {

  processingScan = false;

  document.getElementById(
    "result"
  ).style.display = "none";


  document.getElementById(
    "reader"
  ).innerHTML = "";


  html5QrCode = null;

  scannerRunning = false;


  setTimeout(function() {

    startScanner();

  }, 300);

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   START APPLICATION
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    startScanner();

  }
);

</script>

</body>
</html>
