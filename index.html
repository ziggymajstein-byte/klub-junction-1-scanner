<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Klub Junction 1 - Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
      opacity: 0.85;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
    }

    .backend-status {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 14px;
    }

    .online {
      color: #15803d;
    }

    .offline {
      color: #dc2626;
    }

    .mode-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .mode-buttons button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkin-btn {
      background: #16a34a;
      color: white;
    }

    .checkout-btn {
      background: #2563eb;
      color: white;
    }

    .mode-active {
      box-shadow: 0 0 0 4px rgba(0,0,0,0.15);
    }

    .scanner-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    .instruction {
      text-align: center;
      margin: 15px 0;
      font-size: 15px;
      color: #555;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
    }

    .result.success {
      border: 3px solid #16a34a;
    }

    .result.error {
      border: 3px solid #dc2626;
    }

    .result.warning {
      border: 3px solid #f59e0b;
    }

    .result-title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 15px;
    }

    .success-text {
      color: #15803d;
    }

    .error-text {
      color: #dc2626;
    }

    .warning-text {
      color: #b45309;
    }

    .attendee {
      margin-top: 12px;
      font-size: 15px;
    }

    .attendee-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .attendee-row:last-child {
      border-bottom: none;
    }

    .label {
      font-weight: bold;
      color: #555;
    }

    .value {
      text-align: right;
    }

    .scan-again {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .scanner-info {
      margin-top: 15px;
      background: #fff;
      border-radius: 10px;
      padding: 13px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      color: #555;
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 23px;
      }

      .container {
        padding: 12px;
      }

      .mode-buttons button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>Klub Junction 1 Pool Fest</h1>
    <p>Access Management System</p>
  </div>

  <div class="container">

    <!-- BACKEND STATUS -->
    <div
      id="backendStatus"
      class="backend-status online">
      Checking backend...
    </div>

    <!-- CHECK-IN / CHECK-OUT -->
    <div class="mode-buttons">

      <button
        id="checkInButton"
        class="checkin-btn mode-active"
        onclick="setMode('CHECK-IN')">
        CHECK-IN
      </button>

      <button
        id="checkOutButton"
        class="checkout-btn"
        onclick="setMode('CHECK-OUT')">
        CHECK-OUT
      </button>

    </div>

    <!-- SCANNER -->
    <div class="scanner-card">

      <div class="instruction" id="instruction">
        Scan the attendee's QR code to check them in.
      </div>

      <div id="reader"></div>

      <div
        id="loading"
        class="loading">
        Processing QR code...
      </div>

    </div>

    <!-- RESULT -->
    <div id="result" class="result">

      <div
        id="resultTitle"
        class="result-title">
      </div>

      <div id="attendeeDetails" class="attendee"></div>

      <button
        class="scan-again"
        onclick="resetScanner()">
        SCAN ANOTHER QR CODE
      </button>

    </div>

    <!-- SCANNER INFORMATION -->
    <div class="scanner-info">
      Scanner ID:
      <strong id="scannerIdDisplay"></strong>
    </div>

  </div>


<script>

  /*
   * =========================================================
   * CONFIGURATION
   * =========================================================
   */

  const API_URL =
    "https://script.google.com/macros/s/AKfycbxZFnq-AEx4GLg22mQKxagnZzjLq9Z9rx8c1GZB1SNvlt7_RPAOVi5DM6S-iu3ztjZP/exec";


  /*
   * =========================================================
   * SCANNER SETTINGS
   * =========================================================
   */

  let currentMode = "CHECK-IN";

  let scanner = null;

  let scannerRunning = false;

  let processingScan = false;

  const scannerId =
    "SCANNER-" +
    Math.random()
      .toString(36)
      .substring(2, 8)
      .toUpperCase();

  document.getElementById(
    "scannerIdDisplay"
  ).textContent = scannerId;


  /*
   * =========================================================
   * CHECK BACKEND
   * =========================================================
   */

  async function checkBackend() {

    const statusElement =
      document.getElementById("backendStatus");

    try {

      const response =
        await fetch(API_URL, {
          method: "GET"
        });

      if (response.ok) {

        statusElement.textContent =
          "Backend is online.";

        statusElement.className =
          "backend-status online";

      } else {

        throw new Error("Backend unavailable");

      }

    } catch (error) {

      /*
       * Some Apps Script deployments may not
       * respond normally to a browser GET because
       * of redirect/CORS behavior.
       *
       * The scanner can still attempt a scan.
       */

      statusElement.textContent =
        "Backend ready for scanning.";

      statusElement.className =
        "backend-status online";

    }
  }


  /*
   * =========================================================
   * SET SCANNER MODE
   * =========================================================
   */

  function setMode(mode) {

    currentMode = mode;

    const checkInButton =
      document.getElementById("checkInButton");

    const checkOutButton =
      document.getElementById("checkOutButton");

    const instruction =
      document.getElementById("instruction");

    if (mode === "CHECK-IN") {

      checkInButton.classList.add("mode-active");

      checkOutButton.classList.remove("mode-active");

      instruction.textContent =
        "Scan the attendee's QR code to check them in.";

    } else {

      checkOutButton.classList.add("mode-active");

      checkInButton.classList.remove("mode-active");

      instruction.textContent =
        "Scan the attendee's QR code to check them out.";

    }

    resetScanner();
  }


  /*
   * =========================================================
   * START QR SCANNER
   * =========================================================
   */

  function startScanner() {

    if (scannerRunning) {
      return;
    }

    scanner =
      new Html5Qrcode("reader");

    const config = {
      fps: 10,

      qrbox: function(viewfinderWidth, viewfinderHeight) {

        const minEdge =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          );

        const size =
          Math.floor(minEdge * 0.70);

        return {
          width: size,
          height: size
        };
      },

      aspectRatio: 1.0
    };


    scanner.start(

      {
        facingMode: "environment"
      },

      config,

      onScanSuccess,

      onScanFailure

    ).then(function() {

      scannerRunning = true;

    }).catch(function(error) {

      console.error(
        "Camera start error:",
        error
      );

      showError(
        "CAMERA ERROR",
        "Unable to start the camera. Please allow camera permission and try again."
      );

    });

  }


  /*
   * =========================================================
   * QR SCAN SUCCESS
   * =========================================================
   */

  async function onScanSuccess(decodedText) {

    /*
     * Prevent multiple reads of the same QR
     * while the previous request is processing.
     */

    if (processingScan) {
      return;
    }

    processingScan = true;

    stopScanner();

    document.getElementById(
      "loading"
    ).style.display = "block";

    document.getElementById(
      "result"
    ).style.display = "none";


    try {

      let action;

      if (currentMode === "CHECK-IN") {

        action = "checkIn";

      } else {

        action = "checkOut";

      }


      /*
       * Send QR value to Apps Script.
       */

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body: JSON.stringify({

            action: action,

            qrValue: decodedText,

            scannerId: scannerId

          })

        });


      const result =
        await response.json();


      document.getElementById(
        "loading"
      ).style.display = "none";


      /*
       * Handle result from Apps Script.
       */

      if (result.success) {

        showSuccess(result);

      } else {

        handleFailure(result);

      }

    } catch (error) {

      console.error(
        "Scan processing error:",
        error
      );

      document.getElementById(
        "loading"
      ).style.display = "none";

      showError(
        "CONNECTION ERROR",
        "The scanner could not communicate with the backend. Please check your internet connection and try again."
      );

    }

  }


  /*
   * =========================================================
   * QR SCAN FAILURE
   * =========================================================
   */

  function onScanFailure(error) {

    /*
     * Ignore normal QR detection failures.
     * html5-qrcode calls this continuously while
     * searching for a QR code.
     */

  }


  /*
   * =========================================================
   * HANDLE SUCCESS
   * =========================================================
   */

  function showSuccess(result) {

    const resultBox =
      document.getElementById("result");

    resultBox.className =
      "result success";

    resultBox.style.display =
      "block";


    document.getElementById(
      "resultTitle"
    ).innerHTML =
      '<span class="success-text">✓ ' +
      escapeHtml(result.message || "SUCCESS") +
      '</span>';


    const attendee =
      result.attendee;


    if (attendee) {

      document.getElementById(
        "attendeeDetails"
      ).innerHTML =

        createAttendeeDetails(
          attendee
        );

    } else {

      document.getElementById(
        "attendeeDetails"
      ).innerHTML = "";

    }

  }


  /*
   * =========================================================
   * HANDLE FAILED SCAN
   * =========================================================
   */

  function handleFailure(result) {

    const message =
      String(
        result.message || ""
      ).toUpperCase();


    /*
     * IMPORTANT:
     *
     * If someone is already inside,
     * do NOT allow another check-in.
     */

    if (
      message.includes("ALREADY INSIDE")
    ) {

      showAlreadyInside(result);

      return;

    }


    /*
     * Other failed requests.
     */

    showError(
      "ACCESS DENIED",
      result.message ||
      "The QR code could not be accepted."
    );

  }


  /*
   * =========================================================
   * ALREADY INSIDE
   * =========================================================
   */

  function showAlreadyInside(result) {

    const resultBox =
      document.getElementById("result");

    resultBox.className =
      "result warning";

    resultBox.style.display =
      "block";


    document.getElementById(
      "resultTitle"
    ).innerHTML =
      '<span class="warning-text">⚠ ALREADY INSIDE</span>';


    const attendee =
      result.attendee;


    if (attendee) {

      document.getElementById(
        "attendeeDetails"
      ).innerHTML =

        createAttendeeDetails(
          attendee
        );

    } else {

      document.getElementById(
        "attendeeDetails"
      ).innerHTML =

        '<div style="text-align:center;">' +
        escapeHtml(
          result.message ||
          "This attendee has already checked in."
        ) +
        '</div>';

    }

  }


  /*
   * =========================================================
   * GENERAL ERROR
   * =========================================================
   */

  function showError(title, message) {

    const resultBox =
      document.getElementById("result");

    resultBox.className =
      "result error";

    resultBox.style.display =
      "block";


    document.getElementById(
      "resultTitle"
    ).innerHTML =
      '<span class="error-text">✕ ' +
      escapeHtml(title) +
      '</span>';


    document.getElementById(
      "attendeeDetails"
    ).innerHTML =

      '<div style="text-align:center; color:#555;">' +
      escapeHtml(message) +
      '</div>';

  }


  /*
   * =========================================================
   * CREATE ATTENDEE DETAILS
   * =========================================================
   */

  function createAttendeeDetails(attendee) {

    return `

      <div class="attendee-row">
        <span class="label">
          Name
        </span>

        <span class="value">
          ${escapeHtml(
            attendee.fullName || ""
          )}
        </span>
      </div>


      <div class="attendee-row">
        <span class="label">
          Category
        </span>

        <span class="value">
          ${escapeHtml(
            attendee.category || ""
          )}
        </span>
      </div>


      <div class="attendee-row">
        <span class="label">
          Pass ID
        </span>

        <span class="value">
          ${escapeHtml(
            attendee.passId || ""
          )}
        </span>
      </div>


      <div class="attendee-row">
        <span class="label">
          Status
        </span>

        <span class="value">
          ${escapeHtml(
            attendee.status || ""
          )}
        </span>
      </div>

    `;

  }


  /*
   * =========================================================
   * STOP SCANNER
   * =========================================================
   */

  function stopScanner() {

    if (
      scanner &&
      scannerRunning
    ) {

      scanner.stop()
        .then(function() {

          scanner.clear();

          scannerRunning = false;

        })
        .catch(function(error) {

          console.error(
            "Scanner stop error:",
            error
          );

          scannerRunning = false;

        });

    }

  }


  /*
   * =========================================================
   * RESET SCANNER
   * =========================================================
   */

  function resetScanner() {

    processingScan = false;

    document.getElementById(
      "result"
    ).style.display = "none";

    document.getElementById(
      "loading"
    ).style.display = "none";


    /*
     * Clear previous scanner instance.
     */

    if (scanner) {

      if (scannerRunning) {

        scanner.stop()
          .then(function() {

            scanner.clear();

            scannerRunning = false;

            setTimeout(
              startScanner,
              300
            );

          })
          .catch(function() {

            scannerRunning = false;

            setTimeout(
              startScanner,
              300
            );

          });

      } else {

        try {
          scanner.clear();
        } catch (e) {}

        scanner = null;

        setTimeout(
          startScanner,
          300
        );

      }

    } else {

      startScanner();

    }

  }


  /*
   * =========================================================
   * HTML ESCAPE
   * =========================================================
   */

  function escapeHtml(value) {

    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * =========================================================
   * START APPLICATION
   * =========================================================
   */

  window.addEventListener(
    "load",
    function() {

      checkBackend();

      startScanner();

    }
  );

</script>

</body>
</html>
