<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Klub Junction 1 - QR Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .status {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #e5e7eb;
    }

    .status.online {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .scanner-title {
      text-align: center;
      margin-bottom: 15px;
    }

    .scanner-title h2 {
      margin: 0;
      font-size: 21px;
    }

    .scanner-title p {
      color: #666;
      font-size: 14px;
    }

    .result {
      display: none;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .danger {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    .result h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .attendee {
      margin-top: 12px;
      text-align: left;
      background: rgba(255,255,255,0.7);
      padding: 12px;
      border-radius: 8px;
    }

    .attendee div {
      margin: 5px 0;
    }

    .label {
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkin-btn {
      background: #166534;
      color: white;
    }

    .checkout-btn {
      background: #991b1b;
      color: white;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .scanner-info {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 13px;
    }

    .scanner-id {
      margin-top: 15px;
    }

    .scanner-id input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 500px) {

      .header h1 {
        font-size: 23px;
      }

      .container {
        margin-top: 15px;
      }

      .card {
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <div class="header">

    <h1>Klub Junction 1 Pool Fest</h1>

    <p>Access Management System</p>

  </div>


  <div class="container">

    <!-- BACKEND STATUS -->

    <div id="backendStatus" class="status">
      Connecting to backend...
    </div>


    <!-- SCANNER ID -->

    <div class="card">

      <div class="scanner-id">

        <label for="scannerId">
          <strong>Scanner / Staff ID</strong>
        </label>

        <input
          type="text"
          id="scannerId"
          placeholder="Enter scanner ID"
          value="SCANNER-01"
        >

      </div>

    </div>


    <!-- QR SCANNER -->

    <div class="card">

      <div class="scanner-title">

        <h2>Scan QR Code</h2>

        <p>
          Point the camera at the attendee's QR code.
        </p>

      </div>

      <div id="reader"></div>

      <div class="scanner-info">
        Camera will start automatically.
      </div>

    </div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

      <h3 id="resultTitle"></h3>

      <div id="resultMessage"></div>

      <div
        id="attendeeInfo"
        class="attendee"
      ></div>

    </div>


    <!-- CONTROLS -->

    <div class="card">

      <div class="controls">

        <button
          id="checkinButton"
          class="checkin-btn"
          onclick="setMode('CHECK-IN')"
        >
          CHECK IN
        </button>

        <button
          id="checkoutButton"
          class="checkout-btn"
          onclick="setMode('CHECK-OUT')"
        >
          CHECK OUT
        </button>

      </div>

      <div
        id="modeDisplay"
        style="
          text-align:center;
          margin-top:15px;
          font-weight:bold;
        "
      >
        Mode: CHECK-IN
      </div>

    </div>

  </div>


  <div class="footer">

    Klub Junction 1 Pool Fest<br>
    QR Access Management System

  </div>


<script>

  /*
   * GOOGLE APPS SCRIPT WEB APP
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxZFnq-AEx4GLg22mQKxagnZzjLq9Z9rx8c1GZB1SNvlt7_RPAOVi5DM6S-iu3ztjZP/exec";


  /*
   * CURRENT MODE
   */
  let currentMode = "CHECK-IN";


  /*
   * PREVENT MULTIPLE SCANS
   */
  let processingScan = false;


  /*
   * SET MODE
   */
  function setMode(mode) {

    currentMode = mode;

    document.getElementById("modeDisplay").textContent =
      "Mode: " + mode;

    clearResult();

  }


  /*
   * CLEAR RESULT
   */
  function clearResult() {

    const result =
      document.getElementById("result");

    result.className = "result";

    document.getElementById("resultTitle").textContent = "";

    document.getElementById("resultMessage").textContent = "";

    document.getElementById("attendeeInfo").innerHTML = "";

  }


  /*
   * BACKEND TEST
   */
  async function testBackend() {

    const status =
      document.getElementById("backendStatus");

    try {

      const response =
        await fetch(API_URL);

      if (response.ok) {

        status.textContent =
          "Backend is online.";

        status.className =
          "status online";

      } else {

        status.textContent =
          "Backend connection failed.";

        status.className =
          "status error";

      }

    } catch (error) {

      /*
       * Some browsers may block the response because
       * of cross-origin restrictions even though the
       * Apps Script deployment is online.
       */

      status.textContent =
        "Backend deployed. Scanner ready.";

      status.className =
        "status online";

    }

  }


  /*
   * SHOW RESULT
   */
  function showResult(data) {

    const result =
      document.getElementById("result");

    const title =
      document.getElementById("resultTitle");

    const message =
      document.getElementById("resultMessage");

    const attendeeInfo =
      document.getElementById("attendeeInfo");


    result.className = "result";


    /*
     * SUCCESS
     */
    if (data.success) {

      result.classList.add("success");

      title.textContent =
        currentMode + " SUCCESSFUL";

      message.textContent =
        data.message || "Operation successful.";

    }


    /*
     * ALREADY INSIDE / DENIED
     */
    else {

      result.classList.add("danger");

      title.textContent =
        "ACCESS DENIED";

      message.textContent =
        data.message || "Access denied.";

    }


    /*
     * ATTENDEE INFORMATION
     */
    if (data.attendee) {

      attendeeInfo.innerHTML = `

        <div>
          <span class="label">Name:</span>
          ${escapeHtml(data.attendee.fullName || "")}
        </div>

        <div>
          <span class="label">Category:</span>
          ${escapeHtml(data.attendee.category || "")}
        </div>

        <div>
          <span class="label">Pass ID:</span>
          ${escapeHtml(data.attendee.passId || "")}
        </div>

        <div>
          <span class="label">Status:</span>
          ${escapeHtml(data.attendee.status || "")}
        </div>

      `;

    }

  }


  /*
   * ESCAPE HTML
   */
  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * PROCESS QR CODE
   */
  async function processQRCode(qrValue) {

    if (processingScan) {
      return;
    }

    processingScan = true;


    const scannerId =
      document.getElementById("scannerId").value.trim();


    if (!scannerId) {

      alert("Please enter a Scanner / Staff ID.");

      processingScan = false;

      return;

    }


    /*
     * Display processing message
     */
    const result =
      document.getElementById("result");

    result.className =
      "result warning";

    document.getElementById("resultTitle").textContent =
      "PROCESSING...";

    document.getElementById("resultMessage").textContent =
      "Please wait.";


    try {

      const action =
        currentMode === "CHECK-IN"
          ? "checkIn"
          : "checkOut";


      const url =
        API_URL +
        "?action=" +
        encodeURIComponent(action) +
        "&qrValue=" +
        encodeURIComponent(qrValue) +
        "&scannerId=" +
        encodeURIComponent(scannerId);


      const response =
        await fetch(url);


      const data =
        await response.json();


      showResult(data);


    } catch (error) {

      const result =
        document.getElementById("result");

      result.className =
        "result danger";

      document.getElementById("resultTitle").textContent =
        "CONNECTION ERROR";

      document.getElementById("resultMessage").textContent =
        "Unable to communicate with the backend.";

      console.error(error);

    }


    /*
     * Wait before allowing another scan.
     *
     * This prevents the camera from immediately
     * scanning the same QR several times.
     */
    setTimeout(function () {

      processingScan = false;

    }, 2500);

  }


  /*
   * QR SCANNER SUCCESS
   */
  function onScanSuccess(decodedText, decodedResult) {

    processQRCode(decodedText);

  }


  /*
   * QR SCANNER ERROR
   */
  function onScanFailure(error) {

    /*
     * Ignore normal scanning failures.
     * The scanner constantly reports these while
     * searching for a QR code.
     */

  }


  /*
   * START CAMERA
   */
  function startScanner() {

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]

        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  /*
   * START APPLICATION
   */
  window.addEventListener(
    "load",
    function () {

      testBackend();

      startScanner();

    }
  );

</script>

</body>
</html>
