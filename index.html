<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Klub Junction 1 - QR Scanner</title>

  <!-- QR SCANNER LIBRARY -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .status {
      text-align: center;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      background: #e5e7eb;
    }

    .status.online {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    .scanner-title {
      text-align: center;
      margin-bottom: 15px;
    }

    .scanner-title h2 {
      margin: 0;
      font-size: 21px;
    }

    .scanner-title p {
      color: #666;
      font-size: 14px;
    }

    .result {
      display: none;
      padding: 18px;
      border-radius: 10px;
      margin-top: 20px;
      text-align: center;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .danger {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .warning {
      display: block;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }

    .result h3 {
      margin-top: 0;
      font-size: 20px;
    }

    .attendee {
      margin-top: 12px;
      text-align: left;
      background: rgba(255,255,255,0.7);
      padding: 12px;
      border-radius: 8px;
    }

    .attendee div {
      margin: 5px 0;
    }

    .label {
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .checkin-btn {
      background: #166534;
      color: white;
    }

    .checkout-btn {
      background: #991b1b;
      color: white;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .scanner-info {
      text-align: center;
      margin-top: 15px;
      color: #666;
      font-size: 13px;
    }

    .scanner-id {
      margin-top: 15px;
    }

    .scanner-id input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 500px) {

      .header h1 {
        font-size: 23px;
      }

      .container {
        margin-top: 15px;
      }

      .card {
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <div class="header">

    <h1>Klub Junction 1 Pool Fest</h1>

    <p>Access Management System</p>

  </div>


  <div class="container">

    <!-- BACKEND STATUS -->

    <div id="backendStatus" class="status">
      Connecting to backend...
    </div>


    <!-- STAFF LOGIN -->

<div class="card">

  <div class="scanner-id">

    <label for="scannerId">
      <strong>Staff ID</strong>
    </label>

    <input
      type="text"
      id="scannerId"
      placeholder="Enter Staff ID"
      value="STAFF-002"
    >

    <br><br>

    <label for="staffPin">
      <strong>PIN</strong>
    </label>

    <input
      type="password"
      id="staffPin"
      placeholder="Enter PIN"
      maxlength="6"
    >

    <br><br>

    <button
      type="button"
      onclick="loginStaff()"
      style="
        width:100%;
        background:#111827;
        color:white;
        padding:12px;
        border:none;
        border-radius:8px;
        font-weight:bold;
      "
    >
      LOGIN
    </button>

    <div
      id="staffStatus"
      style="
        margin-top:12px;
        text-align:center;
        font-weight:bold;
      "
    >
      Not logged in
    </div>

  </div>

</div>


    <!-- QR SCANNER -->

<div
  id="scannerSection"
  style="display:none;"
>

  <div class="card">

    <div class="scanner-title">

      <h2>Scan QR Code</h2>

      <p>
        Point the camera at the attendee's QR code.
      </p>

    </div>

    <div id="reader"></div>

    <div class="scanner-info">
      Camera will start automatically.
    </div>

  </div>

</div>


    <!-- RESULT -->

    <div
      id="result"
      class="result"
    >

      <h3 id="resultTitle"></h3>

      <div id="resultMessage"></div>

      <div
        id="attendeeInfo"
        class="attendee"
      ></div>

    </div>


    <!-- CONTROLS -->

<div
  id="controlsSection"
  style="display:none;"
>

  <div class="card">

    <div class="controls">

      <button
        id="checkinButton"
        class="checkin-btn"
        onclick="setMode('CHECK-IN')"
      >
        CHECK IN
      </button>

      <button
        id="checkoutButton"
        class="checkout-btn"
        onclick="setMode('CHECK-OUT')"
      >
        CHECK OUT
      </button>

    </div>

    <div
      id="modeDisplay"
      style="
        text-align:center;
        margin-top:15px;
        font-weight:bold;
      "
    >
      Mode: CHECK-IN
    </div>

  </div>

</div>

  </div>


  <div class="footer">

    Klub Junction 1 Pool Fest<br>
    QR Access Management System

  </div>


<script>

  /*
   * GOOGLE APPS SCRIPT WEB APP
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbxZFnq-AEx4GLg22mQKxagnZzjLq9Z9rx8c1GZB1SNvlt7_RPAOVi5DM6S-iu3ztjZP/exec";


  /*
   * CURRENT MODE
   */
  let currentMode = "CHECK-IN";


  /*
   * PREVENT MULTIPLE SCANS
   */
  let processingScan = false;


  /*
   * SET MODE
   */
  function setMode(mode) {

    currentMode = mode;

    document.getElementById("modeDisplay").textContent =
      "Mode: " + mode;

    clearResult();

  }


  /*
   * CLEAR RESULT
   */
  function clearResult() {

    const result =
      document.getElementById("result");

    result.className = "result";

    document.getElementById("resultTitle").textContent = "";

    document.getElementById("resultMessage").textContent = "";

    document.getElementById("attendeeInfo").innerHTML = "";

  }


  /*
   * BACKEND TEST
   */
  async function testBackend() {

    const status =
      document.getElementById("backendStatus");

    try {

      const response =
        await fetch(API_URL);

      if (response.ok) {

        status.textContent =
          "Backend is online.";

        status.className =
          "status online";

      } else {

        status.textContent =
          "Backend connection failed.";

        status.className =
          "status error";

      }

    } catch (error) {

      /*
       * Some browsers may block the response because
       * of cross-origin restrictions even though the
       * Apps Script deployment is online.
       */

      status.textContent =
        "Backend deployed. Scanner ready.";

      status.className =
        "status online";

    }

  }


  /*
   * SHOW RESULT
   */
  function showResult(data) {

    const result =
      document.getElementById("result");

    const title =
      document.getElementById("resultTitle");

    const message =
      document.getElementById("resultMessage");

    const attendeeInfo =
      document.getElementById("attendeeInfo");


    result.className = "result";


    /*
     * SUCCESS
     */
    if (data.success) {

      result.classList.add("success");

      title.textContent =
        currentMode + " SUCCESSFUL";

      message.textContent =
        data.message || "Operation successful.";

    }


    /*
     * ALREADY INSIDE / DENIED
     */
    else {

      result.classList.add("danger");

      title.textContent =
        "ACCESS DENIED";

      message.textContent =
        data.message || "Access denied.";

    }


    /*
     * ATTENDEE INFORMATION
     */
    if (data.attendee) {

      attendeeInfo.innerHTML = `

        <div>
          <span class="label">Name:</span>
          ${escapeHtml(data.attendee.fullName || "")}
        </div>

        <div>
          <span class="label">Category:</span>
          ${escapeHtml(data.attendee.category || "")}
        </div>

        <div>
          <span class="label">Pass ID:</span>
          ${escapeHtml(data.attendee.passId || "")}
        </div>

        <div>
          <span class="label">Status:</span>
          ${escapeHtml(data.attendee.status || "")}
        </div>

      `;

    }

  }


  /*
   * ESCAPE HTML
   */
  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* ==========================================
   STAFF LOGIN
========================================== */

let loggedInStaff = null;

async function loginStaff() {

  const staffId =
    document.getElementById("scannerId").value.trim();

  const pin =
    document.getElementById("staffPin").value.trim();

  const status =
    document.getElementById("staffStatus");

  if (!staffId || !pin) {

    status.textContent =
      "Please enter Staff ID and PIN.";

    status.style.color = "#991b1b";

    return;

  }

  status.textContent = "Authenticating...";
  status.style.color = "#92400e";

  try {

    const url =
  API_URL +
  "?action=staffLogin" +
  "&staffId=" +
  encodeURIComponent(staffId) +
  "&pin=" +
  encodeURIComponent(pin);

    const response =
      await fetch(url, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });

    const data =
      await response.json();

    console.log("Staff login:", data);

   if (data.success) {

  loggedInStaff = data.staff;

  status.textContent =
    "✓ Logged in: " +
    data.staff.fullName +
    " (" +
    data.staff.role +
    ")";

  status.style.color = "#166534";

  document.getElementById("staffPin").value = "";

  // SHOW SCANNER AFTER SUCCESSFUL LOGIN
  document.getElementById("scannerSection").style.display = "block";

  // SHOW CHECK-IN / CHECK-OUT CONTROLS
  document.getElementById("controlsSection").style.display = "block";
     startScanner();

} else {

      loggedInStaff = null;

      status.textContent =
        "✗ " +
        (data.message || "Invalid Staff ID or PIN.");

      status.style.color = "#991b1b";

    }

  } catch (error) {

    loggedInStaff = null;

    status.textContent =
      "Staff authentication failed.";

    status.style.color = "#991b1b";

    console.error(error);

  }

}

  /*
   * PROCESS QR CODE
   */
  async function processQRCode(qrValue) {

    if (processingScan) {
      return;
    }

    processingScan = true;


    /* ==========================================
   REQUIRE STAFF LOGIN
========================================== */

if (!loggedInStaff) {

  alert("Please login with your Staff ID and PIN first.");

  processingScan = false;

  return;

}

const scannerId =
  loggedInStaff.staffId;

const scannerUser =
  loggedInStaff.fullName;

const staffRole =
  loggedInStaff.role;


    /*
     * Display processing message
     */
    const result =
      document.getElementById("result");

    result.className =
      "result warning";

    document.getElementById("resultTitle").textContent =
      "PROCESSING...";

    document.getElementById("resultMessage").textContent =
      "Please wait.";


    try {

      const action =
        currentMode === "CHECK-IN"
          ? "checkIn"
          : "checkOut";


      const url =
  API_URL +
  "?action=" +
  encodeURIComponent(action) +
  "&qrValue=" +
  encodeURIComponent(qrValue) +
  "&scannerId=" +
  encodeURIComponent(scannerId) +
  "&scannerUser=" +
  encodeURIComponent(scannerUser);


      const response = await fetch(url, {
    method: "GET",
    redirect: "follow",
    cache: "no-store"
});

const responseText = await response.text();

console.log("Backend response:", responseText);

let data;

try {
    data = JSON.parse(responseText);
} catch (jsonError) {
    throw new Error(
        "Backend did not return valid JSON: " + responseText
    );
}

showResult(data);


    } catch (error) {

      const result =
        document.getElementById("result");

      result.className =
        "result danger";

      document.getElementById("resultTitle").textContent =
        "CONNECTION ERROR";

      document.getElementById("resultMessage").textContent =
        "Unable to communicate with the backend.";

      console.error(error);

    }


    /*
     * Wait before allowing another scan.
     *
     * This prevents the camera from immediately
     * scanning the same QR several times.
     */
    setTimeout(function () {

      processingScan = false;

    }, 2500);

  }


  /*
   * QR SCANNER SUCCESS
   */
  function onScanSuccess(decodedText, decodedResult) {

    processQRCode(decodedText);

  }


  /*
   * QR SCANNER ERROR
   */
  function onScanFailure(error) {

    /*
     * Ignore normal scanning failures.
     * The scanner constantly reports these while
     * searching for a QR code.
     */

  }


  /*
   * START CAMERA
   */
  function startScanner() {

    const scanner =
      new Html5QrcodeScanner(
        "reader",
        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          },

          rememberLastUsedCamera: true,

          supportedScanTypes: [
            Html5QrcodeScanType.SCAN_TYPE_CAMERA
          ]

        },
        false
      );


    scanner.render(
      onScanSuccess,
      onScanFailure
    );

  }


  /*
   * START APPLICATION
   */
  window.addEventListener(
  "load",
  function () {

    testBackend();

  }
);

</script>

</body>
</html>
